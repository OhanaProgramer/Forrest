<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forrest Jr</title>
<style>
  :root { --bg:#f5f6f7; --card:#ffffff; --ink:#1c2227; --dim:#6a747d; --line:#e0e4e7;
          --ok:#1f8a4c; --warn:#b7791f; --bad:#c53030; --na:#9aa3ab; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101315; --card:#191e22; --ink:#e5e9ec; --dim:#8a959e; --line:#2a3137;
            --ok:#3fbf75; --warn:#e0a63a; --bad:#f0625f; --na:#5d666e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:14px 16px 10px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; letter-spacing:.01em; }
  #updated { color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
  #updated.stale { color:var(--bad); }

  .strip { display:grid; gap:8px; padding:0 16px;
           grid-template-columns:repeat(auto-fit, minmax(128px, 1fr)); }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:10px 12px 10px 14px; position:relative; overflow:hidden; min-width:0; }
  .tile::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--na); }
  .tile.ok::before { background:var(--ok); }
  .tile.warn::before { background:var(--warn); }
  .tile.bad::before { background:var(--bad); }
  .tile .t { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .tile .v { font-size:19px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.warn .v { color:var(--warn); } .tile.bad .v { color:var(--bad); }
  .tile .d { font-size:12.5px; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums;
             overflow-wrap:anywhere; white-space:pre-line; }

  #camera { margin:12px 16px 0; background:var(--card); border:1px solid var(--line);
            border-radius:10px; padding:10px 12px; max-width:820px; }
  #camera[hidden] { display:none; }
  #camera h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:0 0 8px; }
  #camera img { width:100%; aspect-ratio:4/3; background:#000; border-radius:6px; display:block; }

  footer { padding:12px 16px 18px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header><h1>Forrest Jr</h1><span id="updated">connecting…</span></header>
<section class="strip" id="strip" aria-live="polite"></section>
<section id="camera" hidden>
  <h2>Camera · <span id="cam-fps"></span></h2>
  <img id="view" alt="Live camera view with detection boxes">
</section>
<footer>Read-only · tailnet only · refreshes every 2 s</footer>
<script>
const strip = document.getElementById("strip");
const updated = document.getElementById("updated");
let lastOk = 0;

function render(tiles) {
  // build once, then update text in place so the strip doesn't flicker
  if (strip.children.length !== tiles.length) {
    strip.innerHTML = "";
    for (const _ of tiles) {
      const el = document.createElement("div");
      el.className = "tile";
      el.innerHTML = '<div class="t"></div><div class="v"></div><div class="d"></div>';
      strip.appendChild(el);
    }
  }
  tiles.forEach((t, i) => {
    const el = strip.children[i];
    el.className = "tile " + t.level;
    el.title = t.title + ": " + t.value + (t.detail ? " — " + t.detail : "");
    el.children[0].textContent = t.title;
    el.children[1].textContent = t.value;
    el.children[2].textContent = t.detail || " ";
  });
}

function camera(v) {
  const box = document.getElementById("camera");
  const img = document.getElementById("view");
  if (v && v.running) {
    if (box.hidden) { box.hidden = false; img.src = "/stream"; }
    document.getElementById("cam-fps").textContent = `${v.fps} fps`;
  } else if (!box.hidden) {
    box.hidden = true; img.removeAttribute("src");
  }
}

async function tick() {
  try {
    const r = await fetch("/api/status", {cache: "no-store"});
    const s = await r.json();
    render(s.hardware.tiles);
    camera(s.vision);
    lastOk = Date.now();
    updated.className = "";
    updated.textContent = "updated " + new Date(s.hardware.time * 1000).toLocaleTimeString();
  } catch (e) {
    if (Date.now() - lastOk > 6000) {
      updated.className = "stale";
      updated.textContent = "not reachable — showing last values";
    }
  }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
